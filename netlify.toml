[build]
  command = "npm run build"
  publish = "dist"

# API redirects to serverless functions
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# SPA redirect rule so browser page refreshes on any route route correctly to index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers for production delivery
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
